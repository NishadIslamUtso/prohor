name: Collect semester faculty and sections
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: semester-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Scheduled runs execute on the default branch (GITHUB_REF), but their event payload
      # may omit repository.default_branch, so fall back to ref_name for those runs.
      COLLECTION_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
    steps:
      # Collect into the durable default branch, not a temporary PR branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COLLECTION_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection rules
        run: python3 tools/test-collect-semesters.py
      - name: Collect current feed
        run: python3 tools/collect-semesters.py
      - name: Commit repository collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'data/semesters/*.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: collect semester faculty and sections'
          git push origin "HEAD:refs/heads/$COLLECTION_BRANCH"
