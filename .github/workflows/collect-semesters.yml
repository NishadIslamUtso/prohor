name: Collect semester faculty and sections
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: semester-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This session's only writable branch. See data/semesters/README.md for activation.
      - uses: actions/checkout@v4
        with:
          ref: arena/01a10a61-prohor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection rules
        run: python3 tools/test-collect-semesters.py
      - name: Collect current feed
        run: python3 tools/collect-semesters.py
      - name: Commit repository collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'data/semesters/*.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: collect semester faculty and sections'
          git push origin HEAD:arena/01a10a61-prohor
